# Additive Traefik configuration for the Firefly III MCP gateway.
#
# Drop this beside base.yml in /mnt/main/apps/traefik/dynamic/. The file
# provider runs with --providers.file.directory=/dynamic and watch=true, so
# Traefik picks it up without a restart — and deleting this file reverts
# everything it does.
#
# Nothing here redefines anything base.yml already declares. It adds one
# middleware and one router, and references base.yml's `secure-headers`
# middleware and `keycloak` service by name: the file provider merges every
# file in the directory into one configuration, so cross-file references
# resolve. Redefining an existing name would collide, so don't.
#
# Two edits in base.yml are still required — see "base.yml changes" below.

http:
  middlewares:
    # base.yml's ip-whitelist ranges, plus Anthropic's published egress range.
    # Claude reaches the MCP endpoint from 160.79.104.0/21 and nowhere else;
    # the LAN ranges stay so you can still reach it yourself, and so Claude
    # Code on your Mac works (its requests come from your IP, not Anthropic's).
    mcp-allowlist:
      ipAllowList:
        sourceRange:
          - 160.79.104.0/21   # Anthropic
          - 10.69.0.0/16
          - 192.168.0.0/16
          - 100.64.0.0/10     # Tailscale
          - fd00::/8

  routers:
    # Claude runs OIDC discovery and the token exchange against Keycloak from
    # its own egress range, and you complete the consent screen from a browser
    # that could be anywhere — mobile data included. Both need